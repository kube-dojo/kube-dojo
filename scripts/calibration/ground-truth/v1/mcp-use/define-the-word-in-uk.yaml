# Fixture source: hand-crafted from learn-ukrainian MCP server tool surface.
# The task ("translate 'cloud' to canonical modern Ukrainian + cite + verify
# not a Russicism") has a well-defined minimum tool path:
#   translate_en_uk -> verify_word -> check_modern_form / check_russian_shadow
#   -> search_sources or verify_quote (for the citation).
# Strong models should plan 4-6 tool calls; weak models pick translate_en_uk
# alone (incomplete) or invent tools like `dictionary_lookup`.
fixture_id: define-the-word-in-uk
lane: mcp-use
expected_tools:
  - name: "translate_en_uk"
    aliases: ["mcp__rag__translate_en_uk", "translate_en_uk("]
  - name: "verify_word"
    aliases: ["mcp__rag__verify_word", "verify_word("]
  - name: "check_modern_form"
    aliases: ["mcp__rag__check_modern_form", "check_modern_form("]
  - name: "check_russian_shadow"
    aliases: ["mcp__rag__check_russian_shadow", "check_russian_shadow("]
  - name: "search_sources"
    aliases:
      - "mcp__rag__search_sources"
      - "search_sources("
      - "verify_quote"
      - "mcp__rag__verify_quote"
required_param_signals:
  - "cloud"
  - "SUM"
  - "Hrinchenko"
  - "ESUM"
forbidden_tools:
  - "mcp__rag__dictionary_lookup"
  - "mcp__rag__translate("
  - "mcp__rag__define"
  - "mcp__rag__lookup_word"
  - "mcp__google_translate"
  - "mcp__deepl_translate"
llm_rubric: |-
  Return JSON: {"score": 0-10, "rationale": "..."}.
  10 = picks translate_en_uk + verify_word + at least one of
       (check_modern_form OR check_russian_shadow) + at least one of
       (search_sources OR verify_quote) + a clear stop condition.
  7  = picks 3 of the above with rough ordering.
  4  = picks only translate_en_uk and stops.
  0  = invents tools, doesn't reach the answer, or executes instead of
       planning.
