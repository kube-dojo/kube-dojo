name: Cross-family code review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  review-gemini-3-1-pro:
    name: Review (gemini-3.1-pro-preview)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run cross-family review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          MODEL_TAG: gemini-3.1-pro-preview
          API_ENDPOINT: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_MODEL: gemini-3.1-pro-preview
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/cross_family_review.sh

  review-gemini-3-5-flash-high:
    name: Review (gemini-3.5-flash@high)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run cross-family review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          MODEL_TAG: gemini-3.5-flash@high
          API_ENDPOINT: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_MODEL: gemini-3.5-flash
          REASONING_EFFORT: high
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/cross_family_review.sh

  review-deepseek-v4-pro:
    name: Review (deepseek-v4-pro)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run cross-family review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          MODEL_TAG: deepseek-v4-pro
          API_ENDPOINT: https://api.deepseek.com/chat/completions
          API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          API_MODEL: deepseek-chat
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/cross_family_review.sh
