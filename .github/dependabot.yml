version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    cooldown:
      default-days: 7

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    cooldown:
      default-days: 7

  # npm dependencies (Astro / Starlight site)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "js"
    cooldown:
      default-days: 7
    groups:
      # Batch minor/patch bumps into one PR to cut review noise; majors stay separate.
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
