repos:
  - repo: local
    hooks:
      - id: incident-dedup-gate
        name: incident dedup delta gate
        entry: .venv/bin/python scripts/quality/incident_dedup_gate.py --mode absolute --base origin/main
        language: system
        pass_filenames: false
        always_run: true
      - id: agent-config-injection-scan
        name: agent-config auto-exec injection scan
        entry: .venv/bin/python scripts/security/check_agent_configs.py
        language: system
        pass_filenames: false
        always_run: true
